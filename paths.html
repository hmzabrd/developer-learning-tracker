<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Paths - Developer Learning Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">📚 Learning Tracker</div>
            <button class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="paths.html" class="active">Paths</a></li>
                <li><a href="snippets.html">Snippets</a></li>
                <li><a href="stats.html">Stats</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <div class="dashboard-header">
            <h1>Learning Paths</h1>
            <p>Master your programming skills with structured learning paths</p>
        </div>

        <!-- Filter Controls -->
        <div class="filter-controls">
            <label for="topicFilter">Filter Topics:</label>
            <select id="topicFilter" onchange="applyFilter()">
                <option value="all">All Topics</option>
                <option value="completed">Completed</option>
                <option value="in-progress">In Progress</option>
                <option value="not-started">Not Started</option>
            </select>
        </div>

        <!-- Tabs for paths -->
        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('frontend')">🎨 Frontend</button>
            <button class="tab-button" onclick="switchTab('backend')">⚙️ Backend</button>
            <button class="tab-button" onclick="switchTab('algorithms')">🧮 Algorithms</button>
        </div>

        <!-- Frontend Path -->
        <div class="tab-content active" id="frontend-content">
            <div class="flex-between mb-20">
                <h2>Frontend Development</h2>
                <div class="progress-info">
                    <span id="frontendProgress">0/15 completed</span>
                    <div class="progress-bar" style="width: 100%; height: 6px; background: #e5e7eb; border-radius: 3px; margin-top: 5px;">
                        <div id="frontendProgressBar" class="progress-fill" style="width: 0%; height: 100%; background: #10b981; border-radius: 3px;"></div>
                    </div>
                </div>
            </div>
            <div class="grid" id="frontend-topics"></div>
        </div>

        <!-- Backend Path -->
        <div class="tab-content" id="backend-content">
            <div class="flex-between mb-20">
                <h2>Backend Development</h2>
                <div class="progress-info">
                    <span id="backendProgress">0/15 completed</span>
                    <div class="progress-bar" style="width: 100%; height: 6px; background: #e5e7eb; border-radius: 3px; margin-top: 5px;">
                        <div id="backendProgressBar" class="progress-fill" style="width: 0%; height: 100%; background: #10b981; border-radius: 3px;"></div>
                    </div>
                </div>
            </div>
            <div class="grid" id="backend-topics"></div>
        </div>

        <!-- Algorithms Path -->
        <div class="tab-content" id="algorithms-content">
            <div class="flex-between mb-20">
                <h2>Algorithms & Data Structures</h2>
                <div class="progress-info">
                    <span id="algorithmsProgress">0/15 completed</span>
                    <div class="progress-bar" style="width: 100%; height: 6px; background: #e5e7eb; border-radius: 3px; margin-top: 5px;">
                        <div id="algorithmsProgressBar" class="progress-fill" style="width: 0%; height: 100%; background: #10b981; border-radius: 3px;"></div>
                    </div>
                </div>
            </div>
            <div class="grid" id="algorithms-topics"></div>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            renderPaths();
            
            // Check if hash was set to jump to specific path
            const hash = window.location.hash.substring(1);
            if (hash) {
                switchTab(hash);
            }
        });

        function switchTab(pathId) {
            // Hide all tab contents
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });

            // Remove active class from all buttons
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(pathId + '-content').classList.add('active');

            // Add active class to clicked button
            event.target.classList.add('active');
        }

        function renderPaths() {
            const paths = ['frontend', 'backend', 'algorithms'];
            paths.forEach(path => {
                renderPath(path);
            });
        }

        let currentFilter = 'all';

        function renderPath(path) {
            const container = document.getElementById(path + '-topics');
            let topics = getTopicsByPath(path);

            // Apply filter
            if (currentFilter !== 'all') {
                topics = topics.filter(topic => {
                    if (currentFilter === 'completed') return topic.completed;
                    if (currentFilter === 'in-progress') return !topic.completed && topic.notes.length > 0;
                    if (currentFilter === 'not-started') return !topic.completed && !topic.notes.length;
                    return true;
                });
            }

            container.innerHTML = '';

            if (topics.length === 0) {
                container.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;"><div class="empty-icon">📭</div><div class="empty-title">No Topics Found</div><div class="empty-message">Try adjusting your filter</div></div>';
                return;
            }

            let completedCount = 0;
            const allTopics = getTopicsByPath(path);
            allTopics.forEach(topic => {
                if (topic.completed) completedCount++;
            });

            topics.forEach(topic => {
                const card = createTopicCard(topic.id, topic);
                container.appendChild(card);
            });

            // Update progress
            updatePathProgress(path, completedCount, allTopics.length);
        }

        function applyFilter() {
            const filterValue = document.getElementById('topicFilter').value;
            currentFilter = filterValue;
            renderPaths();
        }

        function updatePathProgress(path, completed, total) {
            const percentage = (completed / total) * 100;
            document.getElementById(path + 'Progress').textContent = completed + '/' + total + ' completed';
            document.getElementById(path + 'ProgressBar').style.width = percentage + '%';
        }
    </script>
</body>
</html>
