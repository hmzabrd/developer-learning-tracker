<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Snippets - Developer Learning Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">📚 Learning Tracker</div>
            <button class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="paths.html">Paths</a></li>
                <li><a href="snippets.html" class="active">Snippets</a></li>
                <li><a href="stats.html">Stats</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <div class="dashboard-header">
            <h1>Code Snippets Library</h1>
            <p>Your collection of code examples and solutions</p>
        </div>

        <!-- Search, Filter and Add Button -->
        <div class="snippets-controls">
            <div class="search-filter-group">
                <input type="text" id="searchBox" placeholder="Search snippets by title..." onkeyup="filterSnippets()" class="search-input">
                <select id="languageFilter" onchange="filterSnippets()" class="language-filter">
                    <option value="">All Languages</option>
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                    <option value="javascript">JavaScript</option>
                </select>
                <select id="sortBy" onchange="filterSnippets()" class="sort-select">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="alphabetical">A - Z</option>
                </select>
            </div>
            <button class="btn-primary" onclick="openSnippetEditor()">+ Add Snippet</button>
        </div>

        <!-- Snippets Container -->
        <div class="grid" id="snippetsContainer"></div>
    </main>

    <!-- Snippet Editor Modal -->
    <div class="modal" id="snippetModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Code Snippet</h2>
                <button class="close-btn" onclick="hideModal('snippetModal')">&times;</button>
            </div>

            <div>
                <label for="snippetTitle">Snippet Title *</label>
                <input type="text" id="snippetTitle" placeholder="e.g., Array Map Example">

                <label for="snippetTopic">Associated Topic *</label>
                <select id="snippetTopic" style="width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #d1d5db; border-radius: 6px;">
                    <option value="">Select a topic...</option>
                </select>

                <label for="snippetLanguage">Language *</label>
                <div style="display: flex; gap: 15px; margin: 10px 0;">
                    <label>
                        <input type="radio" name="language" value="html"> HTML
                    </label>
                    <label>
                        <input type="radio" name="language" value="css"> CSS
                    </label>
                    <label>
                        <input type="radio" name="language" value="javascript" checked> JavaScript
                    </label>
                </div>

                <label for="snippetCode">Code *</label>
                <textarea id="snippetCode" placeholder="Paste your code here..." rows="10"></textarea>

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button class="btn-primary" onclick="saveNewSnippet()">Save Snippet</button>
                    <button class="btn-secondary" onclick="hideModal('snippetModal')">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Snippet View Modal -->
    <div class="modal" id="viewModal">
        <div class="modal-content" style="max-width: 700px;">
            <div class="modal-header">
                <h2 id="viewTitle">Snippet</h2>
                <button class="close-btn" onclick="hideModal('viewModal')">&times;</button>
            </div>
            <div>
                <p id="viewTopic" style="color: #6b7280; font-size: 14px; margin-bottom: 10px;"></p>
                <pre id="viewCode" style="background: #f3f4f6; padding: 15px; border-radius: 4px; overflow-x: auto;"></pre>
                <button class="btn-primary" onclick="copyToClipboard()">Copy Code</button>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
    <script>
        let allSnippets = [];
        let currentViewSnippet = null;

        document.addEventListener('DOMContentLoaded', function() {
            populateTopicSelect();
            renderSnippets();
        });

        function populateTopicSelect() {
            const select = document.getElementById('snippetTopic');
            const topics = loadTopics();

            for (let topicId in topics) {
                const option = document.createElement('option');
                option.value = topicId;
                option.textContent = topics[topicId].name;
                select.appendChild(option);
            }
        }

        function renderSnippets() {
            allSnippets = loadSnippets();
            filterSnippets();
        }

        function filterSnippets() {
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();
            const languageFilter = document.getElementById('languageFilter').value;
            const sortBy = document.getElementById('sortBy').value;
            const container = document.getElementById('snippetsContainer');

            // Filter snippets
            let filtered = allSnippets.filter(snippet => {
                const matchesSearch = snippet.title.toLowerCase().includes(searchTerm);
                const matchesLanguage = !languageFilter || snippet.language === languageFilter;
                return matchesSearch && matchesLanguage;
            });

            // Sort snippets
            if (sortBy === 'newest') {
                filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            } else if (sortBy === 'oldest') {
                filtered.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
            } else if (sortBy === 'alphabetical') {
                filtered.sort((a, b) => a.title.localeCompare(b.title));
            }

            container.innerHTML = '';

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;"><div class="empty-icon">📝</div><div class="empty-title">No Snippets Found</div><div class="empty-message">Create your first code snippet to get started!</div></div>';
                return;
            }

            filtered.forEach(snippet => {
                const card = document.createElement('div');
                card.className = 'card snippet-card';

                const topicName = getTopicName(snippet.topicId);
                const codeLines = snippet.code.split('\n');
                const preview = codeLines.slice(0, 2).join('\n').substring(0, 60);
                const hasMore = codeLines.length > 2 || preview.length < codeLines.slice(0, 2).join('\n').length;
                const languageColor = getLanguageColor(snippet.language);
                const createdDate = formatDate(new Date(snippet.createdAt || new Date()));

                card.innerHTML = `
                    <div class="snippet-card-header">
                        <h3>${snippet.title}</h3>
                        <span class="language-badge" style="background-color: ${languageColor};">${snippet.language.toUpperCase()}</span>
                    </div>
                    <p class="snippet-meta">📌 ${topicName} • ${createdDate}</p>
                    <pre class="snippet-preview">${preview}${hasMore ? '\n...' : ''}</pre>
                    <div class="snippet-actions">
                        <button class="btn-primary" onclick="viewSnippet('${snippet.id}')">View Code</button>
                        <button class="btn-danger" onclick="deleteSnippetConfirm('${snippet.id}')">Delete</button>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function getLanguageColor(language) {
            const colors = {
                'html': '#E34C26',
                'css': '#563D7C',
                'javascript': '#F7DF1E'
            };
            return colors[language] || '#666';
        }

        function openSnippetEditor() {
            document.getElementById('modalTitle').textContent = 'Add Code Snippet';
            document.getElementById('snippetTitle').value = '';
            document.getElementById('snippetTopic').value = '';
            document.getElementById('snippetCode').value = '';
            document.querySelector('input[name="language"][value="javascript"]').checked = true;
            showModal('snippetModal');
        }

        function saveNewSnippet() {
            const title = document.getElementById('snippetTitle').value.trim();
            const topicId = document.getElementById('snippetTopic').value;
            const code = document.getElementById('snippetCode').value.trim();
            const language = document.querySelector('input[name="language"]:checked').value;

            if (!title || !topicId || !code) {
                alert('Please fill in all fields');
                return;
            }

            const snippet = {
                title: title,
                topicId: topicId,
                language: language,
                code: code
            };

            saveSnippet(snippet);
            hideModal('snippetModal');
            renderSnippets();
        }

        function viewSnippet(id) {
            const snippets = loadSnippets();
            const snippet = snippets.find(s => s.id === id);

            if (snippet) {
                currentViewSnippet = snippet;
                document.getElementById('viewTitle').textContent = snippet.title;
                document.getElementById('viewTopic').textContent = 'Topic: ' + getTopicName(snippet.topicId) + ' • Language: ' + snippet.language;
                document.getElementById('viewCode').textContent = snippet.code;
                showModal('viewModal');
            }
        }

        function copyToClipboard() {
            if (currentViewSnippet) {
                navigator.clipboard.writeText(currentViewSnippet.code).then(() => {
                    alert('Code copied to clipboard!');
                }).catch(() => {
                    alert('Failed to copy code');
                });
            }
        }

        function deleteSnippetConfirm(id) {
            if (confirm('Are you sure you want to delete this snippet?')) {
                deleteSnippet(id);
                renderSnippets();
            }
        }
    </script>
</body>
</html>
